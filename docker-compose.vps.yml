services:
  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_started
      core:
        condition: service_started
      receipt-worker:
        condition: service_started
      transaction-worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - banking_network

  gateway:
    image: ${VPS_GATEWAY_IMAGE:?set VPS_GATEWAY_IMAGE}
    env_file: .env
    environment:
      RUNTIME_STACK_ROLE: vps-primary
      CHAT_TRANSPORT: redis
      ASYNC_TRANSPORT: aws
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      ENABLE_WEBHOOK_INGRESS: "true"
      ENABLE_OUTBOUND_SENDER: "true"
      ENABLE_CHAT_CONSUMERS: "false"
      ENABLE_TRANSACTION_WORKER: "false"
      ENABLE_FUNDING_WORKER: "false"
      ENABLE_PAYOUT_WORKER: "false"
      ENABLE_REFUND_WORKER: "false"
      ENABLE_RECEIPT_WORKER: "false"
    restart: unless-stopped
    volumes:
      - /root/.aws:/root/.aws:ro
    networks:
      - banking_network

  core:
    image: ${VPS_CORE_IMAGE:?set VPS_CORE_IMAGE}
    env_file: .env
    environment:
      RUNTIME_STACK_ROLE: vps-primary
      CHAT_TRANSPORT: redis
      ASYNC_TRANSPORT: aws
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      ENABLE_WEBHOOK_INGRESS: "false"
      ENABLE_OUTBOUND_SENDER: "true"
      ENABLE_CHAT_CONSUMERS: "false"
      ENABLE_TRANSACTION_WORKER: "false"
      ENABLE_FUNDING_WORKER: "false"
      ENABLE_PAYOUT_WORKER: "false"
      ENABLE_REFUND_WORKER: "false"
      ENABLE_RECEIPT_WORKER: "false"
    restart: unless-stopped
    volumes:
      - /root/.aws:/root/.aws:ro
    networks:
      - banking_network

  core-chat-worker:
    image: ${VPS_CORE_CHAT_WORKER_IMAGE:?set VPS_CORE_CHAT_WORKER_IMAGE}
    env_file: .env
    environment:
      RUNTIME_STACK_ROLE: vps-primary
      CHAT_TRANSPORT: redis
      ASYNC_TRANSPORT: aws
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      ENABLE_CHAT_CONSUMERS: "true"
      ENABLE_OUTBOUND_SENDER: "true"
    restart: unless-stopped
    volumes:
      - /root/.aws:/root/.aws:ro
    networks:
      - banking_network

  transaction-worker:
    image: ${VPS_TRANSACTION_WORKER_IMAGE:?set VPS_TRANSACTION_WORKER_IMAGE}
    env_file: .env
    environment:
      RUNTIME_STACK_ROLE: vps-primary
      CHAT_TRANSPORT: redis
      ASYNC_TRANSPORT: aws
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      ENABLE_TRANSACTION_WORKER: "true"
      ENABLE_FUNDING_WORKER: "true"
      ENABLE_PAYOUT_WORKER: "true"
      ENABLE_REFUND_WORKER: "true"
      ENABLE_OUTBOUND_SENDER: "true"
    restart: unless-stopped
    volumes:
      - /root/.aws:/root/.aws:ro
    networks:
      - banking_network

  receipt-worker:
    image: ${VPS_RECEIPT_WORKER_IMAGE:?set VPS_RECEIPT_WORKER_IMAGE}
    env_file: .env
    environment:
      RUNTIME_STACK_ROLE: vps-primary
      CHAT_TRANSPORT: redis
      ASYNC_TRANSPORT: aws
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      ENABLE_RECEIPT_WORKER: "true"
      ENABLE_OUTBOUND_SENDER: "true"
    restart: unless-stopped
    volumes:
      - /root/.aws:/root/.aws:ro
    networks:
      - banking_network

networks:
  banking_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
