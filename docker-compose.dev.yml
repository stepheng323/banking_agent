version: "3.8"

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://banking_user:banking_pass@db:5432/banking_db
      - REDIS_URL=redis://redis:6379
      - CORE_SERVICE_URL=http://core:8001
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_FLOW_PRIVATE_KEY=${WHATSAPP_FLOW_PRIVATE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_MINI_APP_BASE_URL=${TELEGRAM_MINI_APP_BASE_URL}
      - TELEGRAM_WEBHOOK_SECRET_TOKEN=${TELEGRAM_WEBHOOK_SECRET_TOKEN}
      - ONBOARDING_FLOW_ID=${ONBOARDING_FLOW_ID}
      - PIN_CONFIRMATION_FLOW_ID=${PIN_CONFIRMATION_FLOW_ID}
      - ACCOUNT_LINKING_FLOW_ID=${ACCOUNT_LINKING_FLOW_ID}
      - MONO_API_KEY=${MONO_API_KEY}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - FLUTTERWAVE_USE_SANDBOX=${FLUTTERWAVE_USE_SANDBOX:-true}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/gateway:/app/apps/gateway
      - ./shared:/app/shared
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://banking_user:banking_pass@db:5432/banking_db
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONO_API_KEY=${MONO_API_KEY}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - FLUTTERWAVE_USE_SANDBOX=${FLUTTERWAVE_USE_SANDBOX:-true}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/core:/app/apps/core
      - ./shared:/app/shared

  receipt-worker:
    build:
      context: .
      dockerfile: apps/receipt/Dockerfile.local
    environment:
      - REDIS_URL=redis://redis:6379
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
