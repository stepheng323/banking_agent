[tool.poetry]
name = "banking-agent"
version = "0.1.0"
description = "WhatsApp Banking Agent Monorepo"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.workspace]
members = [
    "shared",
    "gateway",
    "core"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","B","UP","ASYNC","A","C4"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
