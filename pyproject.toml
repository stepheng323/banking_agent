# Python project configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banking-agent"
version = "0.1.0"
requires-python = ">=3.11"

# BASE dependencies - truly universal, shared by ALL runtimes
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "sqlalchemy>=2.0.44",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "structlog>=25.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "aioboto3>=15.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "shared"]

# App-specific optional dependencies
[project.optional-dependencies]
# Web server stack (FastAPI + ASGI)
web = [
    "fastapi>=0.121.1",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.9",
]

# Core app - AI/Agent dependencies
core = [
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.5",
    "langchain-openai>=1.1.7",
    "langgraph-checkpoint-redis>=0.3.2",
]

receipt = [
    "playwright>=1.57.0",
    "jinja2>=3.0.0",
    "segno>=1.6.6",
]

# Gateway app - web stack + WhatsApp flow encryption + Lambda ASGI adapter
gateway = [
    "banking-agent[web]",
    "mangum>=0.19.0",
    "pycryptodome>=3.23.0",
]

# DB migrations (CI only, not shipped in any runtime image)
migrations = [
    "alembic>=1.17.2",
]

# Runtime-specific bundles for deploy targets
runtime-chat-worker = [
    "banking-agent[core]",
]

runtime-worker-transaction = [
    "banking-agent[web]",
]

runtime-worker-messaging = [
    "banking-agent[receipt]",
]

runtime-worker-receipt = [
    "banking-agent[receipt]",
]

runtime-gateway = [
    "banking-agent[gateway]",
]

# All apps combined (for local dev)
all = [
    "banking-agent[core,receipt,gateway,migrations,runtime-chat-worker,runtime-worker-transaction,runtime-worker-messaging,runtime-worker-receipt,runtime-gateway]",
]

# Development dependencies
[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-watch>=4.2.0",
]

# Pyright (type checking) configuration
[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedVariable = "warning"
reportUnusedImport = "warning"
reportGeneralTypeIssues = "warning"  # Changed from false
reportOptionalMemberAccess = "warning"  # Changed from false
reportOptionalSubscript = "warning"  # Changed from false
reportUntypedFunctionDecorator = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUntypedBaseClass = false
reportUntypedClassDecorator = false
reportUntypedNamedTuple = false
reportPrivateUsage = false
reportTypedDictNotRequiredAccess = false
reportOptionalOperand = false
reportOptionalIterable = false
reportOptionalContextManager = false
strictListInference = false
strictDictionaryInference = false
strictSetInference = false

# Ruff (linting) configuration
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise from exception
    "N805",   # first argument should be self
    "SIM103", # return condition directly (often less readable)
    "SIM105", # use contextlib.suppress (often less clear)
    "SIM112", # use capitalized env var (intentional lowercase sometimes)
    "E712",   # comparison to True/False (intentional for SQLAlchemy)
    "SIM102", # nested if statements (often clearer to keep)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # Allow unused/star imports in __init__.py files
"shared/services/task_planner.py" = ["E501"]  # Long LLM prompts
"shared/services/funding/planner.py" = ["E501"]  # Long error messages
"apps/chat/src/agent/graphs/**" = ["E501"]  # Long nodes/prompts
"apps/chat/src/agent/orchestrator/models/**" = ["E501"]  # Long field descriptions
"scripts/**" = ["E402"]  # Allow sys.path modifications before imports
"**/tests/**" = ["B", "SIM", "E501"]  # Ignore some rules and line length in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["."]

# Relax global strictness
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

# Per-module overrides
[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "apps.chat.src.agent.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# WhatsApp/Telegram clients have deliberate override mismatches with the abstract base
[[tool.mypy.overrides]]
module = [
    "shared.clients.whatsapp.*",
    "shared.clients.telegram.*",
    "shared.clients.providers.mono.*",
    "shared.services.onboarding.*",
    "shared.services.funding.*",
    "shared.services.context_manager",
    "shared.services.task_queue.*",
    "shared.services.affirmation.*",
    "shared.repositories.*",
    "shared.receipts.*",
    "shared.messaging.*",
    "shared.formatters.*",
    "shared.cache.*",
    "shared.clients.factories.*",
    "shared.clients.providers.flutterwave.*",
    "shared.transaction_runtime.*",
    "apps.gateway.api.webhooks.*",
    "apps.chat.src.agent.graphs.transfer.*",
    "apps.chat.src.agent.graphs.airtime.*",
    "apps.chat.src.agent.graphs.data.*",
    "apps.chat.src.agent.graphs.faq.*",
    "apps.chat.src.agent.graphs.account.*",
    "apps.chat.src.agent.graphs.support.*",
    "apps.chat.src.agent.graphs.beneficiary.*",
    "apps.chat.src.agent.graphs.__shared__.*",
    "apps.chat.src.agent.orchestrator.*",
    "apps.chat.src.queue_consumers.*",
    "apps.chat.src.messaging.*",
    "apps.chat.src.runtime_bootstrap",
    "apps.chat.src.worker_main",
]
ignore_errors = true

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:.*'crypt' is deprecated and slated for removal in Python 3\\.13.*:DeprecationWarning:passlib\\..*",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=apps",
    "--cov-report=term-missing",
]
