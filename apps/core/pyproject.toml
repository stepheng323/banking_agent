[tool.poetry]
name = "core-service"
version = "0.1.0"
description = "Core Banking Agent Service with LangGraph"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.5.0"
langgraph = "^0.0.40"
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-core = "^0.1.0"
weasyprint = "^60.0"
jinja2 = "^3.1.0"
celery = "^5.3.0"
shared = {path = "../shared", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
