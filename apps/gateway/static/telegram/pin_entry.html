<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Enter Transaction PIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/telegram/miniapp_theme.js?v=3"></script>
    <link rel="stylesheet" href="/static/telegram/miniapp_shared.css?v=4" />
    <style>
      .pin-shell {
        min-height: 100%;
      }

      .pin-title {
        font-size: 36px;
      }

      .pin-subtitle {
        margin-bottom: 22px;
      }

      .pin-input {
        font-size: 28px;
        letter-spacing: 9px;
        font-weight: 650;
        caret-color: var(--mini-accent);
        -webkit-text-security: disc;
      }

      .pin-submit {
        font-size: 18px;
      }

      body.locked-state .pin-input {
        border-color: var(--mini-danger);
      }

      body.success-state .pin-input {
        border-color: var(--mini-accent);
      }

      body.success-state .pin-submit {
        background: var(--mini-success);
        color: #eef6ef;
      }

      @media (max-width: 420px) {
        .pin-title {
          font-size: 31px;
        }

        .pin-submit {
          font-size: 17px;
        }
      }
    </style>
  </head>

  <body>
    <div class="mini-page">
      <div class="mini-sheet">
        <div class="mini-sheet-content pin-shell">
          <div class="mini-handle"></div>
          <div class="mini-topbar">
            <span class="mini-topbar-icon">×</span>
            <span class="mini-topbar-title" id="headerText">Enter Transaction Pin</span>
            <span class="mini-topbar-icon">⋮</span>
          </div>

          <h2 class="mini-title pin-title">Transaction Pin Required</h2>
          <p class="mini-subtitle pin-subtitle" id="bodyText">
            Please enter your 4-digit transaction pin to authorize your transaction
          </p>

          <div>
            <label class="mini-section-label" for="pinInput">Enter Pin</label>
            <input
              type="password"
              id="pinInput"
              class="mini-input pin-input"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              placeholder="••••"
              autocomplete="off"
            />
            <p class="mini-hint">Enter your transaction pin</p>
          </div>

          <div class="mini-error" id="errorMsg"></div>
          <div class="mini-spacer"></div>

          <div class="mini-footer">
            <button class="mini-btn pin-submit" id="btnSubmit" onclick="submitPin()" disabled>
              <span id="btnSubmitText">Submit</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      window.TelegramMiniAppTheme?.applyTheme({ accentFallback: "#21d07a" });

      try {
        if (tg.MainButton) {
          tg.MainButton.hide();
        }
      } catch (e) {}

      const params = new URLSearchParams(window.location.search);
      const flowToken = params.get("flow_token") || "";
      const chatId = params.get("chat_id") || "";

      const paramHeader = params.get("header");
      const paramBodyText = params.get("body_text");

      if (paramHeader) document.getElementById("headerText").textContent = paramHeader;
      if (paramBodyText) document.getElementById("bodyText").textContent = paramBodyText;

      const PIN_LENGTH = 4;
      const MAX_ATTEMPTS = 3;
      let attempts = 0;
      let locked = false;
      let verified = false;

      const pinInput = document.getElementById("pinInput");
      const btnSubmit = document.getElementById("btnSubmit");
      const btnSubmitText = document.getElementById("btnSubmitText");
      const errorMsg = document.getElementById("errorMsg");

      setTimeout(() => pinInput.focus(), 320);

      function checkInput() {
        if (locked || verified) return;
        pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, PIN_LENGTH);
        btnSubmit.disabled = pinInput.value.length !== PIN_LENGTH;
      }

      pinInput.addEventListener("input", checkInput);

      pinInput.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          pinInput.value.length === PIN_LENGTH &&
          !locked &&
          !verified
        ) {
          submitPin();
        }
      });

      function showError(msg) {
        errorMsg.textContent = msg;
      }

      function updateSubmitButton(text, isLoading) {
        btnSubmitText.textContent = text;
        btnSubmit.disabled = isLoading;
      }

      function lockUI(msg) {
        locked = true;
        showError(msg);
        pinInput.disabled = true;
        document.body.classList.add("locked-state");
        btnSubmitText.textContent = "Close";
        btnSubmit.disabled = false;
        btnSubmit.style.background = "var(--mini-danger)";
        btnSubmit.style.color = "#ffffff";
        btnSubmit.onclick = () => tg.close();
      }

      async function submitPin() {
        if (locked || verified) return;
        const pin = pinInput.value;
        if (pin.length !== PIN_LENGTH) {
          showError("Please enter all 4 digits");
          return;
        }

        locked = true;
        updateSubmitButton("Verifying...", true);
        pinInput.disabled = true;
        showError("");

        try {
          const url = `${window.location.protocol}//${window.location.host}/webhook/telegram/pin_submit`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Telegram-Init-Data": tg.initData || "",
            },
            body: JSON.stringify({
              pin,
              flow_token: flowToken,
              chat_id: chatId,
            }),
          });
          const res = await response.json();

          if (res.success) {
            verified = true;
            document.body.classList.add("success-state");
            tg.HapticFeedback.notificationOccurred("success");
            btnSubmitText.textContent = "✓ Authorized";
            btnSubmit.disabled = false;
            showError("");
            setTimeout(() => tg.close(), 1500);
            return;
          }

          tg.HapticFeedback.notificationOccurred("error");
          locked = false;
          pinInput.disabled = false;
          attempts += 1;
          const serverMsg = res.error || "PIN verification failed";

          if (res.locked || attempts >= MAX_ATTEMPTS) {
            lockUI(serverMsg);
            return;
          }

          pinInput.value = "";
          pinInput.focus();
          showError(serverMsg);
          updateSubmitButton("Submit", false);
          btnSubmit.disabled = true;
        } catch (e) {
          tg.HapticFeedback.notificationOccurred("error");
          locked = false;
          pinInput.disabled = false;
          pinInput.value = "";
          pinInput.focus();
          showError(e.message || "Network error. Please try again.");
          updateSubmitButton("Submit", false);
          btnSubmit.disabled = true;
        }
      }
    </script>
  </body>
</html>
