<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Enter Transaction PIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/telegram/miniapp_theme.js?v=3"></script>
    <link rel="stylesheet" href="/static/telegram/miniapp_shared.css?v=4" />
    <style>
      body.telegram-pin-page {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--mini-bg);
      }

      .telegram-pin-page .mini-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(18px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
      }

      .pin-shell {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }

      .pin-content {
        flex: 1;
        padding-top: 18px;
      }

      .pin-eyebrow {
        margin: 0 0 12px;
        color: var(--mini-text-muted);
        font-size: 15px;
        font-weight: 550;
      }

      .pin-title {
        margin: 0 0 10px;
        color: var(--mini-text);
        font-size: 30px;
        font-weight: 700;
        line-height: 1.15;
      }

      .pin-subtitle {
        max-width: 32rem;
        margin: 0 0 28px;
        color: var(--mini-text-muted);
        font-size: 16px;
        line-height: 1.45;
      }

      .pin-field {
        margin-top: 8px;
      }

      .pin-label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .pin-label-row .mini-section-label {
        margin: 0;
        color: var(--mini-text);
      }

      .pin-label-meta {
        color: var(--mini-text-muted);
        font-size: 13px;
      }

      .pin-input {
        height: 58px;
        border-width: 1px;
        border-radius: 14px;
        background: var(--mini-input-bg);
        font-size: 30px;
        font-weight: 650;
        letter-spacing: 12px;
        text-align: center;
        caret-color: var(--mini-accent);
        -webkit-text-security: disc;
      }

      .pin-input:focus {
        box-shadow: none;
      }

      .pin-error {
        min-height: 20px;
        margin-top: 12px;
        font-size: 14px;
      }

      .pin-footer {
        position: sticky;
        bottom: 0;
        margin-top: 18px;
        padding-top: 12px;
        border-top: none;
        background: var(--mini-bg);
      }

      .pin-submit {
        height: 52px;
        border-radius: 12px;
        font-size: 17px;
      }

      body.locked-state .pin-input {
        border-color: var(--mini-danger);
      }

      body.success-state .pin-input {
        border-color: var(--mini-accent);
      }

      body.success-state .pin-submit {
        background: var(--mini-success);
        color: #ffffff;
      }

      @media (max-width: 420px) {
        .telegram-pin-page .mini-page {
          padding-right: 16px;
          padding-left: 16px;
        }

        .pin-title {
          font-size: 28px;
        }

        .pin-subtitle {
          font-size: 15px;
        }

        .pin-input {
          font-size: 28px;
          letter-spacing: 10px;
        }

        .pin-submit {
          font-size: 17px;
        }
      }
    </style>
  </head>

  <body class="telegram-pin-page">
    <div class="mini-page">
      <div class="pin-shell">
        <main class="pin-content">
          <p class="pin-eyebrow" id="headerText">Secure authorization</p>
          <h1 class="pin-title">Enter PIN</h1>
          <p class="pin-subtitle" id="bodyText">
            Use your 6-digit transaction PIN to authorize this transaction.
          </p>

          <div class="pin-field">
            <div class="pin-label-row">
              <label class="mini-section-label" for="pinInput">Transaction PIN</label>
              <span class="pin-label-meta">6 digits</span>
            </div>
            <input
              type="password"
              id="pinInput"
              class="mini-input pin-input"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              autocomplete="off"
            />
          </div>

          <div class="mini-error pin-error" id="errorMsg"></div>
        </main>

        <div class="mini-footer pin-footer">
          <button class="mini-btn pin-submit" id="btnSubmit" onclick="submitPin()" disabled>
            <span id="btnSubmitText">Authorize</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      window.TelegramMiniAppTheme?.applyTheme({ accentFallback: "#21d07a" });

      try {
        if (tg.MainButton) {
          tg.MainButton.hide();
        }
      } catch (e) {}

      const params = new URLSearchParams(window.location.search);
      const bootstrapNonce = params.get("boot") || "";
      let flowToken = "";
      let chatId = "";

      const PIN_LENGTH = 6;
      const MAX_ATTEMPTS = 3;
      let attempts = 0;
      let locked = false;
      let verified = false;

      const pinInput = document.getElementById("pinInput");
      const btnSubmit = document.getElementById("btnSubmit");
      const btnSubmitText = document.getElementById("btnSubmitText");
      const errorMsg = document.getElementById("errorMsg");

      function checkInput() {
        if (locked || verified) return;
        pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, PIN_LENGTH);
        btnSubmit.disabled = pinInput.value.length !== PIN_LENGTH;
      }

      pinInput.addEventListener("input", checkInput);

      pinInput.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          pinInput.value.length === PIN_LENGTH &&
          !locked &&
          !verified
        ) {
          submitPin();
        }
      });

      function showError(msg) {
        errorMsg.textContent = msg;
      }

      function updateSubmitButton(text, isLoading) {
        btnSubmitText.textContent = text;
        btnSubmit.disabled = isLoading;
      }

      async function bootstrapMiniApp() {
        if (!bootstrapNonce) {
          return { success: false, error: "Session expired. Please reopen this page from Telegram." };
        }
        if (!tg.initData) {
          return { success: false, error: "Telegram authentication missing. Reopen this page from Telegram." };
        }
        try {
          const url = `${window.location.protocol}//${window.location.host}/webhook/telegram/bootstrap`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Telegram-Init-Data": tg.initData || "",
            },
            body: JSON.stringify({ boot: bootstrapNonce, endpoint: "pin" }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.success) {
            return { success: false, error: payload.error || payload.detail || "Session expired. Please reopen this page from Telegram." };
          }
          flowToken = payload.flow_token || "";
          chatId = payload.chat_id || "";
          if (payload.header) document.getElementById("headerText").textContent = payload.header;
          if (payload.body_text) document.getElementById("bodyText").textContent = payload.body_text;
          return { success: true };
        } catch (err) {
          return { success: false, error: "Network error. Please try again." };
        }
      }

      function lockUI(msg) {
        locked = true;
        showError(msg);
        pinInput.disabled = true;
        document.body.classList.add("locked-state");
        btnSubmitText.textContent = "Close";
        btnSubmit.disabled = false;
        btnSubmit.style.background = "var(--mini-danger)";
        btnSubmit.style.color = "#ffffff";
        btnSubmit.onclick = () => tg.close();
      }

      async function initializePin() {
        updateSubmitButton("Loading...", true);
        pinInput.disabled = true;
        const boot = await bootstrapMiniApp();
        if (!boot.success) {
          lockUI(boot.error || "Session expired. Please reopen this page from Telegram.");
          return;
        }
        pinInput.disabled = false;
        updateSubmitButton("Authorize", false);
        btnSubmit.disabled = true;
        setTimeout(() => pinInput.focus(), 320);
      }

      async function submitPin() {
        if (locked || verified) return;
        const pin = pinInput.value;
        if (pin.length !== PIN_LENGTH) {
          showError("Please enter all 6 digits");
          return;
        }

        locked = true;
        updateSubmitButton("Verifying...", true);
        pinInput.disabled = true;
        showError("");

        try {
          if (!tg.initData) {
            throw new Error("Telegram authentication missing. Reopen this page from Telegram.");
          }
          const url = `${window.location.protocol}//${window.location.host}/webhook/telegram/pin_submit`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Telegram-Init-Data": tg.initData || "",
            },
            body: JSON.stringify({
              pin,
              flow_token: flowToken,
              chat_id: chatId,
            }),
          });
          const res = await response.json().catch(() => ({}));

          if (response.ok && res.success) {
            verified = true;
            document.body.classList.add("success-state");
            tg.HapticFeedback.notificationOccurred("success");
            btnSubmitText.textContent = "✓ Authorized";
            btnSubmit.disabled = false;
            showError("");
            setTimeout(() => tg.close(), 1500);
            return;
          }

          tg.HapticFeedback.notificationOccurred("error");
          locked = false;
          pinInput.disabled = false;
          attempts += 1;
          const serverMsg = res.error || res.detail || res.message || "PIN verification failed";

          if (res.locked || attempts >= MAX_ATTEMPTS) {
            lockUI(serverMsg);
            return;
          }

          pinInput.value = "";
          pinInput.focus();
          showError(serverMsg);
          updateSubmitButton("Authorize", false);
          btnSubmit.disabled = true;
        } catch (e) {
          tg.HapticFeedback.notificationOccurred("error");
          locked = false;
          pinInput.disabled = false;
          pinInput.value = "";
          pinInput.focus();
          showError(e.message || "Network error. Please try again.");
          updateSubmitButton("Authorize", false);
          btnSubmit.disabled = true;
        }
      }

      initializePin();
    </script>
  </body>
</html>
