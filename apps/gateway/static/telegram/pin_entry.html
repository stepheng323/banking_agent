<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enter Transaction PIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Full white background matching WhatsApp */
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #000000;
        }

        .subtitle {
            font-size: 15px;
            color: #4a4a4a;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .pin-input-container {
            position: relative;
            margin-bottom: 8px;
        }

        .pin-input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            font-size: 24px;
            letter-spacing: 16px;
            font-weight: 600;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background: transparent;
            color: #111111;
            outline: none;
            -webkit-text-security: disc;
            text-align: center;
            caret-color: #00A884;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pin-input::placeholder {
            letter-spacing: normal;
            font-size: 16px;
            font-weight: 400;
            color: #999999;
        }

        .pin-input:focus {
            border-color: #00A884;
            box-shadow: 0 0 0 1px #00A884;
        }

        .error-msg {
            color: #e53935;
            font-size: 14px;
            margin-top: 8px;
            min-height: 20px;
            text-align: center;
        }

        .spacer {
            flex: 1;
            min-height: 32px;
        }

        button.btn-submit {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            background: #00A884;
            color: #ffffff;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, background 0.15s;
            margin-top: auto;
        }

        button.btn-submit:disabled {
            background: #cccccc;
            cursor: not-allowed;
            color: #ffffff;
        }

        button.btn-submit:active:not(:disabled) {
            opacity: 0.85;
        }

        .success-state .pin-input {
            border-color: #00A884;
        }

        .success-state button.btn-submit {
            background: #2e7d32;
        }

        .locked-state .pin-input {
            border-color: #e53935;
        }
    </style>
</head>

<body>
    <h1 id="headerText">Transaction PIN</h1>
    <p class="subtitle" id="bodyText">Please enter your 4-digit transaction PIN to authorize this request.</p>

    <div class="pin-input-container">
        <input type="password" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4"
            placeholder="••••" autocomplete="off">
    </div>
    <div class="error-msg" id="errorMsg"></div>

    <div class="spacer"></div>

    <button class="btn-submit" id="btnSubmit" onclick="submitPin()">
        Submit
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        try {
            tg.setBackgroundColor('#ffffff');
            tg.setHeaderColor('#ffffff');
        } catch (e) { }

        const params = new URLSearchParams(window.location.search);
        const flowToken = params.get('flow_token') || '';
        const chatId = params.get('chat_id') || '';

        // Safely extract the header and body text if passed in the URL (optional)
        // This is usually handled via server-side templating but we can do it via JS for simplicity
        const paramHeader = params.get('header');
        const paramBodyText = params.get('body_text');

        if (paramHeader) document.getElementById('headerText').textContent = decodeURIComponent(paramHeader);
        if (paramBodyText) document.getElementById('bodyText').textContent = decodeURIComponent(paramBodyText);

        const PIN_LENGTH = 4;
        const MAX_ATTEMPTS = 3;
        let attempts = 0;
        let locked = false;
        let verified = false;

        const pinInput = document.getElementById('pinInput');
        const btnSubmit = document.getElementById('btnSubmit');
        const errorMsg = document.getElementById('errorMsg');

        // Focus the input immediately
        setTimeout(() => pinInput.focus(), 300);

        function checkInput() {
            if (locked || verified) return;
            pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, PIN_LENGTH);
            btnSubmit.disabled = pinInput.value.length !== PIN_LENGTH;

            if (tg.MainButton && tg.MainButton.isVisible) {
                if (pinInput.value.length === PIN_LENGTH) {
                    tg.MainButton.enable();
                    tg.MainButton.color = '#00A884';
                } else {
                    tg.MainButton.disable();
                    tg.MainButton.color = '#cccccc';
                }
            }
        }

        pinInput.addEventListener('input', checkInput);

        pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && pinInput.value.length === PIN_LENGTH && !locked && !verified) {
                submitPin();
            }
        });

        // Setup MainButton if available
        if (tg.MainButton) {
            btnSubmit.style.display = 'none'; // Hide HTML fallback
            tg.MainButton.setText('Submit');
            tg.MainButton.color = '#cccccc';
            tg.MainButton.textColor = '#ffffff';
            tg.MainButton.show();
            tg.MainButton.disable();
            tg.MainButton.onClick(() => submitPin());
        } else {
            btnSubmit.disabled = true;
        }

        function showError(msg) {
            errorMsg.textContent = msg;
        }

        function updateSubmitButton(text, isLoading) {
            if (tg.MainButton) {
                tg.MainButton.setText(text);
                if (isLoading) {
                    tg.MainButton.showProgress();
                    tg.MainButton.disable();
                } else {
                    tg.MainButton.hideProgress();
                }
            } else {
                btnSubmit.textContent = text;
                btnSubmit.disabled = isLoading;
            }
        }

        function lockUI(msg) {
            locked = true;
            showError(msg);
            pinInput.disabled = true;
            document.body.classList.add('locked-state');

            if (tg.MainButton) {
                tg.MainButton.setText('Close');
                tg.MainButton.color = '#e53935';
                tg.MainButton.enable();
                tg.MainButton.onClick(() => tg.close());
            } else {
                btnSubmit.textContent = 'Close';
                btnSubmit.disabled = false;
                btnSubmit.style.background = '#e53935';
                btnSubmit.onclick = () => tg.close();
            }
        }

        async function submitPin() {
            if (locked || verified) return;
            const pin = pinInput.value;
            if (pin.length !== PIN_LENGTH) {
                showError('Please enter all 4 digits');
                return;
            }

            locked = true;
            updateSubmitButton('Verifying...', true);
            pinInput.disabled = true;
            showError('');

            const data = {
                pin: pin,
                flow_token: flowToken,
                chat_id: chatId,
            };

            try {
                const proto = window.location.protocol;
                const host = window.location.host;
                const url = `${proto}//${host}/webhook/telegram/pin_submit`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const res = await response.json();

                if (res.success) {
                    verified = true;
                    document.body.classList.add('success-state');

                    if (tg.MainButton) {
                        tg.MainButton.setText('✓ Authorized');
                        tg.MainButton.color = '#2e7d32'; // Darker green
                        tg.MainButton.hideProgress();
                    } else {
                        btnSubmit.textContent = '✓ Authorized';
                        btnSubmit.style.background = '#2e7d32';
                        btnSubmit.disabled = false;
                    }

                    showError('');
                    setTimeout(() => tg.close(), 1500);
                    return;
                }

                // PIN failed — unlock for retry
                locked = false;
                pinInput.disabled = false;
                attempts++;
                const serverMsg = res.error || 'PIN verification failed';

                if (res.locked || attempts >= MAX_ATTEMPTS) {
                    lockUI(serverMsg);
                    return;
                }

                pinInput.value = '';
                pinInput.focus();
                showError(serverMsg);
                updateSubmitButton('Submit', false);

                // Disable button again since input is empty
                if (tg.MainButton) tg.MainButton.disable();
                else btnSubmit.disabled = true;

            } catch (e) {
                locked = false;
                pinInput.disabled = false;
                pinInput.value = '';
                pinInput.focus();
                showError(e.message || 'Network error. Please try again.');
                updateSubmitButton('Submit', false);

                if (tg.MainButton) tg.MainButton.disable();
                else btnSubmit.disabled = true;
            }
        }
    </script>
</body>

</html>
