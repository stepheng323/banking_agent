<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Enter Transaction PIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/static/telegram/miniapp_theme.js?v=6"></script>
    <link rel="stylesheet" href="/static/telegram/miniapp_shared.css?v=8" />
    <style>
      body.telegram-pin-page {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--mini-bg);
      }

      .telegram-pin-page .mini-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      }

      .pin-shell {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
      }

      .pin-content {
        flex: 1;
        padding-top: 14px;
      }

      .pin-profile {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        text-align: left;
        margin: 10px 0 28px;
      }

      .pin-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, var(--mini-link), #46dfc2);
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
        flex: 0 0 auto;
      }

      .pin-eyebrow {
        margin: 0 0 3px;
        color: var(--mini-text-muted);
        font-size: 13px;
        font-weight: 600;
      }

      .pin-title {
        margin: 0 0 2px;
        color: var(--mini-text);
        font-size: 22px;
        font-weight: 800;
        line-height: 1.1;
      }

      .pin-subtitle {
        max-width: 25rem;
        margin: 0;
        color: var(--mini-text-muted);
        font-size: 14px;
        line-height: 1.36;
      }

      .pin-section-title {
        margin: 0 0 12px;
        color: var(--mini-text);
        font-size: 23px;
        font-weight: 800;
      }

      .pin-group {
        border-radius: 15px;
        overflow: hidden;
        background: var(--mini-section-bg);
      }

      .pin-input-row,
      .pin-action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 64px;
        padding: 12px 16px;
        border: 0;
        border-bottom: 1px solid var(--mini-separator);
        background: transparent;
        color: var(--mini-text);
        text-align: left;
        width: 100%;
      }

      .pin-input-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .pin-label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        width: 100%;
        gap: 12px;
      }

      .pin-label {
        color: var(--mini-text);
        font-size: 16px;
        font-weight: 700;
      }

      .pin-label-meta {
        color: var(--mini-text-muted);
        font-size: 13px;
      }

      .pin-input {
        height: 52px;
        border: 1px solid var(--mini-input-border);
        border-radius: 12px;
        background: var(--mini-secondary-bg);
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 8px;
        text-align: center;
        padding: 0 14px;
        caret-color: var(--mini-link);
      }

      .pin-input:focus {
        border-color: var(--mini-link);
        box-shadow: 0 0 0 1px var(--mini-link);
      }

      .pin-input::placeholder {
        color: var(--mini-text-muted);
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0;
      }

      .pin-error {
        min-height: 20px;
        margin: 12px 4px 0;
        font-size: 14px;
      }

      .pin-action-row {
        border-bottom: 0;
        color: var(--mini-link);
        font: inherit;
        cursor: pointer;
      }

      .pin-action-row:not(:disabled):active {
        background: var(--mini-accent-soft);
      }

      .pin-action-row:disabled {
        color: var(--mini-button-disabled-text);
        cursor: default;
      }

      .uses-native-main-button .pin-action-row {
        display: none;
      }

      .uses-native-main-button .pin-input-row {
        border-bottom: 0;
      }

      .pin-action-left {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        font-size: 17px;
        font-weight: 650;
      }

      .pin-chevron {
        color: var(--mini-text-muted);
        font-size: 31px;
        line-height: 1;
      }

      body.locked-state .pin-input {
        border-color: var(--mini-danger);
      }

      body.locked-state .pin-action-row {
        color: var(--mini-danger);
      }

      body.success-state .pin-action-row {
        color: var(--mini-success);
      }

      @media (max-width: 420px) {
        .telegram-pin-page .mini-page {
          padding-right: 16px;
          padding-left: 16px;
        }

        .pin-content {
          padding-top: 12px;
        }

        .pin-profile {
          margin: 10px 0 24px;
        }

        .pin-avatar {
          width: 42px;
          height: 42px;
          font-size: 19px;
        }

        .pin-title {
          font-size: 21px;
        }

        .pin-subtitle {
          font-size: 14px;
        }

        .pin-input {
          font-size: 28px;
          letter-spacing: 11px;
        }
      }
    </style>
  </head>

  <body class="telegram-pin-page">
    <div class="mini-page">
      <div class="pin-shell">
        <main class="pin-content">
          <header class="pin-profile mini-app-profile">
            <div class="pin-avatar mini-app-avatar" aria-hidden="true">{app_initial}</div>
            <div class="mini-app-copy">
              <p class="pin-eyebrow" id="headerText">Secure authorization</p>
              <h1 class="pin-title mini-app-title">{app_name_short}</h1>
              <p class="pin-subtitle mini-app-subtitle" id="bodyText">
                Use your 6-digit transaction PIN to continue.
              </p>
            </div>
          </header>

          <h2 class="pin-section-title">Enter PIN</h2>
          <div class="pin-group">
            <div class="pin-input-row">
            <div class="pin-label-row">
              <label class="pin-label" for="pinInput">Transaction PIN</label>
              <span class="pin-label-meta">6 digits</span>
            </div>
            <input
              type="password"
              id="pinInput"
              class="mini-input pin-input"
              placeholder="Enter 6-digit PIN"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              autocomplete="off"
            />
            </div>
            <button class="pin-action-row" id="btnSubmit" onclick="submitPin()" disabled>
              <span class="pin-action-left">
                <span id="btnSubmitText">Authorize</span>
              </span>
              <span class="pin-chevron" aria-hidden="true">›</span>
            </button>
          </div>

          <div class="mini-error pin-error" id="errorMsg"></div>
        </main>
      </div>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      window.TelegramMiniAppTheme?.applyTheme({ accentFallback: "#2ea6ff" });

      const params = new URLSearchParams(window.location.search);
      const bootstrapNonce = params.get("boot") || "";
      let flowToken = "";
      let chatId = "";

      const PIN_LENGTH = 6;
      const MAX_ATTEMPTS = 3;
      let attempts = 0;
      let locked = false;
      let verified = false;

      const pinInput = document.getElementById("pinInput");
      const btnSubmit = document.getElementById("btnSubmit");
      const btnSubmitText = document.getElementById("btnSubmitText");
      const errorMsg = document.getElementById("errorMsg");
      const nativeMainButton = tg.MainButton || null;
      const useNativeMainButton = Boolean(nativeMainButton && typeof nativeMainButton.setText === "function");
      let nativeMainButtonAction = () => submitPin();

      if (useNativeMainButton) {
        document.body.classList.add("uses-native-main-button");
        nativeMainButton.onClick(() => nativeMainButtonAction());
      }

      function checkInput() {
        if (locked || verified) return;
        pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, PIN_LENGTH);
        setSubmitEnabled(pinInput.value.length === PIN_LENGTH);
      }

      pinInput.addEventListener("input", checkInput);

      pinInput.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          pinInput.value.length === PIN_LENGTH &&
          !locked &&
          !verified
        ) {
          submitPin();
        }
      });

      function showError(msg) {
        errorMsg.textContent = msg;
      }

      function setSubmitEnabled(isEnabled) {
        btnSubmit.disabled = !isEnabled;
        if (useNativeMainButton) {
          try {
            if (isEnabled) {
              nativeMainButton.enable();
            } else {
              nativeMainButton.disable();
            }
          } catch (e) {}
        }
      }

      function updateSubmitButton(text, isLoading, isEnabled = !isLoading) {
        btnSubmitText.textContent = text;
        btnSubmit.disabled = isLoading || !isEnabled;
        if (!useNativeMainButton) {
          return;
        }

        try {
          nativeMainButton.setText(text || "Authorize");
          if (isLoading) {
            nativeMainButton.showProgress(false);
            nativeMainButton.disable();
          } else {
            nativeMainButton.hideProgress();
            if (isEnabled) {
              nativeMainButton.enable();
            } else {
              nativeMainButton.disable();
            }
          }
          nativeMainButton.show();
        } catch (e) {}
      }

      async function bootstrapMiniApp() {
        if (!bootstrapNonce) {
          return { success: false, error: "Session expired. Please reopen this page from Telegram." };
        }
        if (!tg.initData) {
          return { success: false, error: "Telegram authentication missing. Reopen this page from Telegram." };
        }
        try {
          const url = `${window.location.protocol}//${window.location.host}/webhook/telegram/bootstrap`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Telegram-Init-Data": tg.initData || "",
            },
            body: JSON.stringify({ boot: bootstrapNonce, endpoint: "pin" }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload.success) {
            return { success: false, error: payload.error || payload.detail || "Session expired. Please reopen this page from Telegram." };
          }
          flowToken = payload.flow_token || "";
          chatId = payload.chat_id || "";
          return { success: true };
        } catch (err) {
          return { success: false, error: "Network error. Please try again." };
        }
      }

      function lockUI(msg) {
        locked = true;
        showError(msg);
        pinInput.disabled = true;
        document.body.classList.add("locked-state");
        nativeMainButtonAction = () => tg.close();
        updateSubmitButton("Close", false, true);
        btnSubmit.onclick = () => tg.close();
      }

      async function initializePin() {
        updateSubmitButton("Loading...", true, false);
        pinInput.disabled = true;
        const boot = await bootstrapMiniApp();
        if (!boot.success) {
          lockUI(boot.error || "Session expired. Please reopen this page from Telegram.");
          return;
        }
        pinInput.disabled = false;
        updateSubmitButton("Authorize", false, false);
        setTimeout(() => pinInput.focus(), 320);
      }

      async function submitPin() {
        if (locked || verified) return;
        const pin = pinInput.value;
        if (pin.length !== PIN_LENGTH) {
          showError("Please enter all 6 digits");
          return;
        }

        locked = true;
        updateSubmitButton("Verifying...", true, false);
        pinInput.disabled = true;
        showError("");

        try {
          if (!tg.initData) {
            throw new Error("Telegram authentication missing. Reopen this page from Telegram.");
          }
          const url = `${window.location.protocol}//${window.location.host}/webhook/telegram/pin_submit`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Telegram-Init-Data": tg.initData || "",
            },
            body: JSON.stringify({
              pin,
              flow_token: flowToken,
              chat_id: chatId,
            }),
          });
          const res = await response.json().catch(() => ({}));

          if (response.ok && res.success) {
            verified = true;
            document.body.classList.add("success-state");
            tg.HapticFeedback.notificationOccurred("success");
            nativeMainButtonAction = () => tg.close();
            btnSubmit.onclick = () => tg.close();
            updateSubmitButton("Authorized", false, true);
            showError("");
            setTimeout(() => tg.close(), 1500);
            return;
          }

          tg.HapticFeedback.notificationOccurred("error");
          locked = false;
          pinInput.disabled = false;
          attempts += 1;
          const serverMsg = res.error || res.detail || res.message || "PIN verification failed";

          if (res.locked || attempts >= MAX_ATTEMPTS) {
            lockUI(serverMsg);
            return;
          }

          pinInput.value = "";
          pinInput.focus();
          showError(serverMsg);
          updateSubmitButton("Authorize", false, false);
        } catch (e) {
          tg.HapticFeedback.notificationOccurred("error");
          locked = false;
          pinInput.disabled = false;
          pinInput.value = "";
          pinInput.focus();
          showError(e.message || "Network error. Please try again.");
          updateSubmitButton("Authorize", false, false);
        }
      }

      initializePin();
    </script>
  </body>
</html>
