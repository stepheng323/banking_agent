name: Bootstrap AWS Dev Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run mode"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      create_github_actions_role:
        description: "Manage GitHub OIDC provider and role in bootstrap stack"
        required: true
        default: false
        type: boolean
      state_key_prefix:
        description: "S3 object prefix for Terraform state access (example: dev/*)"
        required: true
        default: "dev/*"
        type: string

concurrency:
  group: bootstrap-aws-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VAR_aws_region: us-east-1
  TF_DIR: infrastructure/aws-backend-bootstrap
  TF_VAR_state_bucket_name: banking-agent-tf-state-dev-use1-808537413474
  TF_VAR_github_actions_role_name: banking-agent-github-actions-role-dev
  TF_VAR_github_repo_owner: ${{ github.repository_owner }}
  TF_VAR_github_repo_name: ${{ github.event.repository.name }}
  TF_VAR_create_github_actions_role: ${{ github.event.inputs.create_github_actions_role || 'false' }}
  TF_VAR_state_key_prefix: ${{ github.event.inputs.state_key_prefix || 'dev/*' }}

jobs:
  terraform-plan:
    name: Terraform Bootstrap Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bootstrap Role Secret
        run: |
          if [ -z "${{ secrets.AWS_BOOTSTRAP_ROLE_ARN_DEV }}" ]; then
            echo "Missing required repository secret: AWS_BOOTSTRAP_ROLE_ARN_DEV"
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC Bootstrap Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Import existing backend resources
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "State already contains $address"
              return
            fi

            echo "Importing $address from $id"
            terraform import -input=false "$address" "$id"
          }

          if aws s3api head-bucket --bucket "$TF_VAR_state_bucket_name" >/dev/null 2>&1; then
            import_if_missing "aws_s3_bucket.tf_state" "$TF_VAR_state_bucket_name"
            import_if_missing "aws_s3_bucket_versioning.tf_state" "$TF_VAR_state_bucket_name" || true
            import_if_missing "aws_s3_bucket_server_side_encryption_configuration.tf_state" "$TF_VAR_state_bucket_name" || true
            import_if_missing "aws_s3_bucket_public_access_block.tf_state" "$TF_VAR_state_bucket_name" || true
          else
            echo "Bucket $TF_VAR_state_bucket_name not found yet; skipping imports."
          fi

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false

  terraform-apply:
    name: Terraform Bootstrap Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bootstrap Role Secret
        run: |
          if [ -z "${{ secrets.AWS_BOOTSTRAP_ROLE_ARN_DEV }}" ]; then
            echo "Missing required repository secret: AWS_BOOTSTRAP_ROLE_ARN_DEV"
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC Bootstrap Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Import existing backend resources
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail

          import_if_missing() {
            local address="$1"
            local id="$2"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "State already contains $address"
              return
            fi

            echo "Importing $address from $id"
            terraform import -input=false "$address" "$id"
          }

          if aws s3api head-bucket --bucket "$TF_VAR_state_bucket_name" >/dev/null 2>&1; then
            import_if_missing "aws_s3_bucket.tf_state" "$TF_VAR_state_bucket_name"
            import_if_missing "aws_s3_bucket_versioning.tf_state" "$TF_VAR_state_bucket_name" || true
            import_if_missing "aws_s3_bucket_server_side_encryption_configuration.tf_state" "$TF_VAR_state_bucket_name" || true
            import_if_missing "aws_s3_bucket_public_access_block.tf_state" "$TF_VAR_state_bucket_name" || true
          else
            echo "Bucket $TF_VAR_state_bucket_name not found yet; skipping imports."
          fi

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve
