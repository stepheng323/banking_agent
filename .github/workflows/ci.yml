name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "banking/**"
      - "shared/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose*.yml"
      - "Makefile"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type-check)
        run: uv run mypy .

      - name: Pytest (tests)
        run: uv run pytest -q

  vps-runtime-image-smoke:
    name: VPS Runtime Image Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: chat-worker-vps
            dockerfile: apps/chat/Dockerfile
            module: apps.chat.src.worker_main
            symbol: main
          - name: gateway-vps
            dockerfile: apps/gateway/Dockerfile
            module: apps.gateway.main
            symbol: app
          - name: transaction-worker-vps
            dockerfile: apps/transaction/Dockerfile
            module: apps.transaction.main
            symbol: app
          - name: receipt-worker-vps
            dockerfile: apps/receipt/Dockerfile.local
            module: apps.receipt.main
            symbol: app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: |
          set -euo pipefail
          docker buildx build --load -f "${{ matrix.dockerfile }}" -t "banking-agent-${{ matrix.name }}:ci" .

      - name: Validate runtime image boot boundary
        run: |
          set -euo pipefail
          docker run --rm "banking-agent-${{ matrix.name }}:ci" sh -lc \
            "command -v uvicorn >/dev/null && python -c \"import importlib; m = importlib.import_module('${{ matrix.module }}'); getattr(m, '${{ matrix.symbol }}')\""
          echo "✓ ${{ matrix.name }} runtime image smoke passed"
