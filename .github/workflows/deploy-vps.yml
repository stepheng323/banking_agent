name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ vars.VPS_HOST || '217.216.66.68' }}
  VPS_SSH_USER: ${{ vars.VPS_SSH_USER || 'root' }}
  VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/srv/banking_agent' }}
  VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: banking-agent-vps

jobs:
  lint-and-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type-check)
        run: uv run mypy .

      - name: Pytest (tests)
        run: uv run pytest -q

  vps-runtime-image-smoke:
    name: VPS Runtime Image Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: core-vps
            dockerfile: apps/core/Dockerfile
            validate_expr: import importlib; m = importlib.import_module('apps.core.src.main'); getattr(m, 'app')
          - name: gateway-vps
            dockerfile: apps/gateway/Dockerfile
            validate_expr: import importlib; m = importlib.import_module('apps.gateway.main'); getattr(m, 'app')
          - name: core-chat-worker-vps
            dockerfile: apps/core/Dockerfile.worker
            validate_expr: import importlib; importlib.import_module('apps.core.src.worker_main')
          - name: transaction-worker-vps
            dockerfile: apps/core/Dockerfile.transaction_worker
            validate_expr: import importlib; m = importlib.import_module('apps.core.src.transaction_worker_app'); getattr(m, 'app')
          - name: receipt-worker-vps
            dockerfile: apps/receipt/Dockerfile.local
            validate_expr: import importlib; m = importlib.import_module('apps.receipt.main'); getattr(m, 'app')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: |
          set -euo pipefail
          docker buildx build --load -f "${{ matrix.dockerfile }}" -t "banking-agent-${{ matrix.name }}:ci" .

      - name: Validate runtime image boot boundary
        run: |
          set -euo pipefail
          docker run --rm "banking-agent-${{ matrix.name }}:ci" python -c "${{ matrix.validate_expr }}"
          echo "✓ ${{ matrix.name }} runtime image smoke passed"

  build-vps-images:
    name: Build and Push VPS Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint-and-test, vps-runtime-image-smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gateway
            dockerfile: apps/gateway/Dockerfile
            image_suffix: gateway
          - name: core
            dockerfile: apps/core/Dockerfile
            image_suffix: core
          - name: core-chat-worker
            dockerfile: apps/core/Dockerfile.worker
            image_suffix: core-chat-worker
          - name: transaction-worker
            dockerfile: apps/core/Dockerfile.transaction_worker
            image_suffix: transaction-worker
          - name: receipt-worker
            dockerfile: apps/receipt/Dockerfile.local
            image_suffix: receipt-worker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower-case image repo
        id: image_meta
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_repo="${GHCR_REGISTRY}/${owner}/${GHCR_IMAGE_PREFIX}-${{ matrix.image_suffix }}"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.image_meta.outputs.image_repo }}:latest
          cache-from: type=gha,scope=vps-${{ matrix.name }}
          cache-to: type=gha,scope=vps-${{ matrix.name }},mode=max

  deploy-vps:
    name: Deploy VPS Stack
    runs-on: ubuntu-latest
    needs: [build-vps-images]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate required deploy secrets
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$GHCR_PULL_USERNAME"
          test -n "$GHCR_PULL_TOKEN"

      - name: Set deployment image refs
        id: image_refs
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          base="${GHCR_REGISTRY}/${owner}/${GHCR_IMAGE_PREFIX}"
          echo "gateway=${base}-gateway:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "core=${base}-core:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "core_chat_worker=${base}-core-chat-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "transaction_worker=${base}-transaction-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "receipt_worker=${base}-receipt-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -p "$VPS_SSH_PORT" -T 10 "$VPS_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Configure SSH client options
        run: |
          set -euo pipefail
          cat > "$HOME/.ssh/config" <<EOF
          Host vps-deploy
            HostName ${VPS_HOST}
            User ${VPS_SSH_USER}
            Port ${VPS_SSH_PORT}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Ensure remote app directory exists
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" vps-deploy "mkdir -p '$VPS_APP_DIR/deploy'"

      - name: Sync deploy assets to VPS
        run: |
          set -euo pipefail
          rsync -az \
            -e "ssh -F $HOME/.ssh/config" \
            docker-compose.vps.yml \
            deploy/ \
            "vps-deploy:$VPS_APP_DIR/"

      - name: Pull and restart VPS stack
        env:
          GITHUB_SHA: ${{ github.sha }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          VPS_GATEWAY_IMAGE: ${{ steps.image_refs.outputs.gateway }}
          VPS_CORE_IMAGE: ${{ steps.image_refs.outputs.core }}
          VPS_CORE_CHAT_WORKER_IMAGE: ${{ steps.image_refs.outputs.core_chat_worker }}
          VPS_TRANSACTION_WORKER_IMAGE: ${{ steps.image_refs.outputs.transaction_worker }}
          VPS_RECEIPT_WORKER_IMAGE: ${{ steps.image_refs.outputs.receipt_worker }}
        run: |
          set -euo pipefail

          ssh -F "$HOME/.ssh/config" vps-deploy \
            "APP_DIR='$VPS_APP_DIR' \
            GITHUB_SHA='$GITHUB_SHA' \
            GHCR_PULL_USERNAME='$GHCR_PULL_USERNAME' \
            GHCR_PULL_TOKEN='$GHCR_PULL_TOKEN' \
            VPS_GATEWAY_IMAGE='$VPS_GATEWAY_IMAGE' \
            VPS_CORE_IMAGE='$VPS_CORE_IMAGE' \
            VPS_CORE_CHAT_WORKER_IMAGE='$VPS_CORE_CHAT_WORKER_IMAGE' \
            VPS_TRANSACTION_WORKER_IMAGE='$VPS_TRANSACTION_WORKER_IMAGE' \
            VPS_RECEIPT_WORKER_IMAGE='$VPS_RECEIPT_WORKER_IMAGE' \
            bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          echo "Deploying commit $GITHUB_SHA"
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin

          docker compose -f docker-compose.vps.yml config >/dev/null
          docker compose -f docker-compose.vps.yml pull gateway core core-chat-worker transaction-worker receipt-worker
          docker compose -f docker-compose.vps.yml up -d --remove-orphans gateway core core-chat-worker transaction-worker receipt-worker caddy
          docker compose -f docker-compose.vps.yml ps

          check_health() {
            local name="$1"
            local url="$2"
            local attempt
            for attempt in $(seq 1 20); do
              if curl -fsS "$url" >/tmp/health.out 2>/dev/null; then
                echo "✓ $name: $(cat /tmp/health.out)"
                return 0
              fi
              sleep 5
            done
            echo "Health check failed for $name ($url)"
            return 1
          }

          check_health gateway "http://localhost/health"
          check_health core "http://localhost/core/health"
          check_health transaction "http://localhost/transaction/health"
          check_health receipt "http://localhost/receipt/health"
          EOF

      - name: Capture VPS logs on failure
        if: failure()
        env:
          VPS_GATEWAY_IMAGE: ${{ steps.image_refs.outputs.gateway }}
          VPS_CORE_IMAGE: ${{ steps.image_refs.outputs.core }}
          VPS_CORE_CHAT_WORKER_IMAGE: ${{ steps.image_refs.outputs.core_chat_worker }}
          VPS_TRANSACTION_WORKER_IMAGE: ${{ steps.image_refs.outputs.transaction_worker }}
          VPS_RECEIPT_WORKER_IMAGE: ${{ steps.image_refs.outputs.receipt_worker }}
        run: |
          set -euo pipefail
          ssh -F "$HOME/.ssh/config" vps-deploy \
            "cd '$VPS_APP_DIR' \
            && VPS_GATEWAY_IMAGE='$VPS_GATEWAY_IMAGE' \
            VPS_CORE_IMAGE='$VPS_CORE_IMAGE' \
            VPS_CORE_CHAT_WORKER_IMAGE='$VPS_CORE_CHAT_WORKER_IMAGE' \
            VPS_TRANSACTION_WORKER_IMAGE='$VPS_TRANSACTION_WORKER_IMAGE' \
            VPS_RECEIPT_WORKER_IMAGE='$VPS_RECEIPT_WORKER_IMAGE' \
            docker compose -f docker-compose.vps.yml logs --tail=120 gateway core core-chat-worker transaction-worker receipt-worker caddy"
