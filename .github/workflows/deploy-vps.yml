name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: ${{ vars.VPS_HOST || '217.216.66.68' }}
  VPS_SSH_USER: ${{ vars.VPS_SSH_USER || 'root' }}
  VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/srv/banking_agent' }}
  VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: banking-agent-vps

jobs:
  lint-and-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type-check)
        run: uv run mypy .

      - name: Pytest (tests)
        run: uv run pytest -q

  vps-runtime-image-smoke:
    name: VPS Runtime Image Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gateway-vps
            dockerfile: apps/gateway/Dockerfile
            validate_expr: import importlib; m = importlib.import_module('apps.gateway.main'); getattr(m, 'app')
          - name: chat-worker-vps
            dockerfile: apps/chat/Dockerfile
            validate_expr: import importlib; importlib.import_module('apps.chat.src.worker_main')
          - name: transaction-worker-vps
            dockerfile: apps/transaction/Dockerfile
            validate_expr: import importlib; m = importlib.import_module('apps.transaction.main'); getattr(m, 'app')
          - name: receipt-worker-vps
            dockerfile: apps/receipt/Dockerfile.local
            validate_expr: import importlib; m = importlib.import_module('apps.receipt.main'); getattr(m, 'app')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: |
          set -euo pipefail
          builder_name="ci-smoke-${{ matrix.name }}"
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            docker buildx rm "$builder_name" >/dev/null 2>&1 || true
            if docker buildx create --name "$builder_name" --use --driver docker-container >/dev/null \
              && docker buildx inspect --bootstrap >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Buildx bootstrap failed after $attempt attempts"
              exit 1
            fi
            echo "Buildx bootstrap failed on attempt $attempt, retrying..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Build runtime image
        run: |
          set -euo pipefail
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            if docker buildx build --load -f "${{ matrix.dockerfile }}" -t "banking-agent-${{ matrix.name }}:ci" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Runtime image build failed after $attempt attempts"
              exit 1
            fi
            echo "Runtime image build failed on attempt $attempt, retrying..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Validate runtime image boot boundary
        run: |
          set -euo pipefail
          docker run --rm "banking-agent-${{ matrix.name }}:ci" python -c "${{ matrix.validate_expr }}"
          echo "✓ ${{ matrix.name }} runtime image smoke passed"

  build-vps-images:
    name: Build and Push VPS Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint-and-test, vps-runtime-image-smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gateway
            dockerfile: apps/gateway/Dockerfile
            image_suffix: gateway
          - name: chat-worker
            dockerfile: apps/chat/Dockerfile
            image_suffix: chat-worker
          - name: transaction-worker
            dockerfile: apps/transaction/Dockerfile
            image_suffix: transaction-worker
          - name: receipt-worker
            dockerfile: apps/receipt/Dockerfile.local
            image_suffix: receipt-worker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower-case image repo
        id: image_meta
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_repo="${GHCR_REGISTRY}/${owner}/${GHCR_IMAGE_PREFIX}-${{ matrix.image_suffix }}"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        run: |
          set -euo pipefail
          builder_name="ci-push-${{ matrix.name }}"
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            docker buildx rm "$builder_name" >/dev/null 2>&1 || true
            if docker buildx create --name "$builder_name" --use --driver docker-container >/dev/null \
              && docker buildx inspect --bootstrap >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Buildx bootstrap failed after $attempt attempts"
              exit 1
            fi
            echo "Buildx bootstrap failed on attempt $attempt, retrying..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Build and push image
        run: |
          set -euo pipefail
          image_repo="${{ steps.image_meta.outputs.image_repo }}"
          attempt=1
          until [ "$attempt" -gt 3 ]; do
            if docker buildx build \
              --push \
              --file "${{ matrix.dockerfile }}" \
              --tag "${image_repo}:${GITHUB_SHA}" \
              --tag "${image_repo}:latest" \
              --cache-from "type=gha,scope=vps-${{ matrix.name }}" \
              --cache-to "type=gha,scope=vps-${{ matrix.name }},mode=max" \
              .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build and push failed after $attempt attempts"
              exit 1
            fi
            echo "Build and push failed on attempt $attempt, retrying..."
            attempt=$((attempt + 1))
            sleep 20
          done

  deploy-vps:
    name: Deploy VPS Stack
    runs-on: ubuntu-latest
    needs: [build-vps-images]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate required deploy secrets
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$GHCR_PULL_USERNAME"
          test -n "$GHCR_PULL_TOKEN"

      - name: Set deployment image refs
        id: image_refs
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          base="${GHCR_REGISTRY}/${owner}/${GHCR_IMAGE_PREFIX}"
          echo "gateway=${base}-gateway:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "chat_worker=${base}-chat-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "transaction_worker=${base}-transaction-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "receipt_worker=${base}-receipt-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy VPS stack via canonical script
        env:
          GITHUB_SHA: ${{ github.sha }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          STACK_GATEWAY_IMAGE: ${{ steps.image_refs.outputs.gateway }}
          STACK_CHAT_WORKER_IMAGE: ${{ steps.image_refs.outputs.chat_worker }}
          STACK_TRANSACTION_WORKER_IMAGE: ${{ steps.image_refs.outputs.transaction_worker }}
          STACK_RECEIPT_WORKER_IMAGE: ${{ steps.image_refs.outputs.receipt_worker }}
        run: |
          set -euo pipefail
          echo "Deploying commit $GITHUB_SHA"
          ./deploy-stack.sh remote

      - name: Capture VPS logs on failure
        if: failure()
        env:
          STACK_GATEWAY_IMAGE: ${{ steps.image_refs.outputs.gateway }}
          STACK_CHAT_WORKER_IMAGE: ${{ steps.image_refs.outputs.chat_worker }}
          STACK_TRANSACTION_WORKER_IMAGE: ${{ steps.image_refs.outputs.transaction_worker }}
          STACK_RECEIPT_WORKER_IMAGE: ${{ steps.image_refs.outputs.receipt_worker }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_SSH_USER}@${VPS_HOST}" \
            "cd '$VPS_APP_DIR' \
            && STACK_GATEWAY_IMAGE='$STACK_GATEWAY_IMAGE' \
            STACK_CHAT_WORKER_IMAGE='$STACK_CHAT_WORKER_IMAGE' \
            STACK_TRANSACTION_WORKER_IMAGE='$STACK_TRANSACTION_WORKER_IMAGE' \
            STACK_RECEIPT_WORKER_IMAGE='$STACK_RECEIPT_WORKER_IMAGE' \
            docker compose -f docker-compose.yml logs --tail=120 gateway chat-worker transaction-worker receipt-worker caddy"
