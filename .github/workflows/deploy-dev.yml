name: Deploy to AWS Dev Environment

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "shared/**"
      - "infrastructure/aws/**"
      - ".github/workflows/deploy-dev.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "shared/**"
      - "infrastructure/aws/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: infrastructure/aws
  ECR_CORE_REPO: banking-agent-core-dev
  ECR_GATEWAY_REPO: banking-agent-gateway-dev
  ECS_CLUSTER: banking-agent-cluster-dev
  ECS_SERVICE: banking-agent-core-chat-worker
  LAMBDA_TRANSACTION_FUNCTION: banking-agent-transaction-worker-dev
  LAMBDA_RECEIPT_FUNCTION: banking-agent-receipt-worker-dev
  LAMBDA_GATEWAY_FUNCTION: banking-agent-gateway-webhooks-dev
  LAMBDA_IMAGE_PLATFORM: linux/amd64

jobs:
  lint-and-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type-check)
        run: uv run mypy .

      - name: Pytest (tests)
        run: uv run pytest -q

  runtime-boundary-smoke:
    name: Runtime Boundary Smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: receipt-runtime
            extra: runtime-worker-receipt
            module: apps.core.src.lambda_handlers.receipt_worker_handler
            symbol: handler
          - name: transaction-runtime
            extra: runtime-worker-transaction
            module: apps.core.src.lambda_handlers.transaction_worker_handler
            symbol: handler
          - name: gateway-runtime
            extra: runtime-gateway
            module: apps.gateway.lambda_handler
            symbol: handler
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate runtime import boundary
        run: |
          set -euo pipefail

          venv=".venv-${{ matrix.name }}"
          uv venv "$venv"
          uv pip install --python "$venv/bin/python" ".[${{ matrix.extra }}]"
          "$venv/bin/python" -c "import importlib; m = importlib.import_module('${{ matrix.module }}'); getattr(m, '${{ matrix.symbol }}')"
          echo "✓ ${{ matrix.name }} runtime import check passed"

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [lint-and-test, runtime-boundary-smoke]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808537413474:role/banking-agent-github-actions-role-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Verify Terraform source snapshot
        working-directory: ${{ env.TF_DIR }}
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "Checked out commit: $(git rev-parse HEAD)"

          echo "Checking ECS task size..."
          grep -nE 'cpu\s*=\s*"1024"' modules/compute-ecs/main.tf
          grep -nE 'memory\s*=\s*"2048"' modules/compute-ecs/main.tf

          echo "Checking Lambda reserved env keys are not configured..."
          if grep -nE 'AWS_REGION\s*=\s*var\.aws_region' \
            modules/compute-lambda-events/main.tf \
            modules/compute-lambda-gateway/main.tf; then
            echo "ERROR: Reserved Lambda env var AWS_REGION is still configured in source."
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_redis_url: ${{ secrets.REDIS_URL_DEV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL_DEV }}
          TF_VAR_secret_config_values: ${{ secrets.TF_SECRET_CONFIG_JSON_DEV }}
          TF_VAR_non_secret_config_values: ${{ secrets.TF_NON_SECRET_CONFIG_JSON_DEV }}
        run: terraform plan -input=false

  build-images:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [lint-and-test, runtime-boundary-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: chat-worker
            dockerfile: apps/core/Dockerfile.worker
            ecr_repo_env: ECR_CORE_REPO
            tag_prefix: chat-worker
            is_lambda: false
          - name: transaction-worker-lambda
            dockerfile: apps/core/Dockerfile.lambda.transaction
            ecr_repo_env: ECR_CORE_REPO
            tag_prefix: lambda-transaction
            is_lambda: true
          - name: receipt-worker-lambda
            dockerfile: apps/core/Dockerfile.lambda.receipt
            ecr_repo_env: ECR_CORE_REPO
            tag_prefix: lambda-receipt
            is_lambda: true
          - name: gateway-lambda
            dockerfile: apps/gateway/Dockerfile.lambda
            ecr_repo_env: ECR_GATEWAY_REPO
            tag_prefix: lambda
            is_lambda: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808537413474:role/banking-agent-github-actions-role-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          repo_name="${{ env[matrix.image.ecr_repo_env] }}"
          if aws ecr describe-repositories --repository-names "$repo_name" >/dev/null 2>&1; then
            echo "ECR repository already exists: $repo_name"
          else
            echo "Creating missing ECR repository: $repo_name"
            aws ecr create-repository \
              --repository-name "$repo_name" \
              --image-tag-mutability MUTABLE \
              --image-scanning-configuration scanOnPush=true >/dev/null
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.is_lambda && env.LAMBDA_IMAGE_PLATFORM || '' }}
          provenance: ${{ !matrix.image.is_lambda }}
          sbom: ${{ !matrix.image.is_lambda }}
          outputs: ${{ matrix.image.is_lambda && 'type=image,oci-mediatypes=false,push=true' || '' }}
          push: ${{ !matrix.image.is_lambda }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env[matrix.image.ecr_repo_env] }}:${{ matrix.image.tag_prefix }}-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env[matrix.image.ecr_repo_env] }}:${{ matrix.image.tag_prefix }}-latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Validate Lambda manifest media type
        if: matrix.image.is_lambda
        run: |
          set -euo pipefail
          repo_name="${{ env[matrix.image.ecr_repo_env] }}"
          tag="${{ matrix.image.tag_prefix }}-${{ github.sha }}"

          media_type="$(aws ecr describe-images \
            --repository-name "$repo_name" \
            --image-ids imageTag="$tag" \
            --query 'imageDetails[0].imageManifestMediaType' \
            --output text)"

          echo "$repo_name:$tag -> $media_type"

          case "$media_type" in
            application/vnd.docker.distribution.manifest.v2+json)
              ;;
            *)
              echo "ERROR: Lambda-incompatible manifest media type ($media_type)"
              echo "Expected: application/vnd.docker.distribution.manifest.v2+json"
              exit 1
              ;;
          esac

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-validate, build-images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808537413474:role/banking-agent-github-actions-role-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_redis_url: ${{ secrets.REDIS_URL_DEV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL_DEV }}
          TF_VAR_secret_config_values: ${{ secrets.TF_SECRET_CONFIG_JSON_DEV }}
          TF_VAR_non_secret_config_values: ${{ secrets.TF_NON_SECRET_CONFIG_JSON_DEV }}
        run: terraform plan -input=false -out=plan.out

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_redis_url: ${{ secrets.REDIS_URL_DEV }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL_DEV }}
          TF_VAR_secret_config_values: ${{ secrets.TF_SECRET_CONFIG_JSON_DEV }}
          TF_VAR_non_secret_config_values: ${{ secrets.TF_NON_SECRET_CONFIG_JSON_DEV }}
        run: terraform apply -input=false -auto-approve plan.out

  database-migrations:
    name: DB Migrations & Seeding
    runs-on: ubuntu-latest
    needs: [terraform-apply]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[migrations]"

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: alembic upgrade head

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [database-migrations, build-images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808537413474:role/banking-agent-github-actions-role-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Force New ECS Deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Update Lambda Functions
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          update_lambda() {
            local fn_name="$1"
            local image_uri="$2"

            echo "Updating $fn_name → $image_uri"
            aws lambda get-function --function-name "$fn_name" >/dev/null
            aws lambda update-function-code \
              --function-name "$fn_name" \
              --image-uri "$image_uri"
            aws lambda wait function-updated --function-name "$fn_name"
            echo "✓ $fn_name updated"
          }

          update_lambda "${LAMBDA_TRANSACTION_FUNCTION}" \
            "$ECR_REGISTRY/$ECR_CORE_REPO:lambda-transaction-${{ github.sha }}"

          update_lambda "${LAMBDA_RECEIPT_FUNCTION}" \
            "$ECR_REGISTRY/$ECR_CORE_REPO:lambda-receipt-${{ github.sha }}"

          update_lambda "${LAMBDA_GATEWAY_FUNCTION}" \
            "$ECR_REGISTRY/$ECR_GATEWAY_REPO:lambda-${{ github.sha }}"
