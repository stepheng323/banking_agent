version: "3.8"

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Stack for caching, message queue, and LangGraph checkpoints
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gateway Service (WhatsApp + LangGraph)
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://banking_user:banking_pass@db:5432/banking_db
      - REDIS_URL=redis://redis:6379
      - CORE_SERVICE_URL=http://core:8001
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_FLOW_PRIVATE_KEY_PATH=/app/whatsapp_flow_private_key.pem
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/gateway:/app/apps/gateway
      - ./shared:/app/shared
      - ./whatsapp_flow_private_key.pem:/app/whatsapp_flow_private_key.pem:ro

  # Core Service (Banking + Receipts API)
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://banking_user:banking_pass@db:5432/banking_db
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/core:/app/apps/core
      - ./shared:/app/shared

  # Core Consumer (Message Queue Worker)
  consumer:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    command: python apps/core/src/consumer.py
    environment:
      - DATABASE_URL=postgresql://banking_user:banking_pass@db:5432/banking_db
      - REDIS_URL=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/core:/app/apps/core
      - ./shared:/app/shared
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
