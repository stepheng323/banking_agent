[GLOBAL]
pants_version = "2.29.0"
level = "info"
colors = true

# Performance optimizations
[run_shell_command]
workdir = "."
use_integrated_shell = true

# Enable Python backends
backend_packages = [
  "pants.backend.python",
  "pants.backend.python.lint.black",
  "pants.backend.docker",
]

[source]
root_patterns = [
  "/",
]

[python]
interpreter_constraints = ["==3.12.*"]

enable_resolves = true
default_resolve = "python-default"

[python.resolves]
python-default = "python-default.lock"

[python-infer]
imports = true
init_files = "always"

[black]
args = ["--line-length=100"]

[pytest]
args = ["-v"]

[python.resolve]
# Enable pip resolver for faster dependency resolution
interpreter_constraints = ["==3.12.*"]

[engine]
# Enable local caching for faster builds
targets_dir = ".pants.d/targets"
workdir = ".pants.d/workdir"