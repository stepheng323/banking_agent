[GLOBAL]
pants_version = "2.29.0"
level = "info"
colors = true

# Enable Python backends
backend_packages = [
  "pants.backend.python",
  "pants.backend.python.lint.black",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.python.typecheck.mypy",
  "pants.backend.docker",
]

[source]
root_patterns = ["/"]

[python]
# Allow Python 3.12+ up to 3.14 (psycopg3 supports Python 3.13)
interpreter_constraints = [">=3.12,<3.14"]
enable_resolves = true
default_resolve = "python-default"

[python-infer]
imports = true
init_files = "always"

[python.resolves]
python-default = "python-default.lock"


[black]
args = ["--line-length=100"]

[pytest]
args = ["-v"]

[mypy]
args = [
  "--strict",
  "--ignore-missing-imports",
  "--disallow-untyped-defs",
  "--disallow-incomplete-defs",
  "--check-untyped-defs",
  "--no-implicit-optional",
  "--warn-return-any",
  "--warn-unused-configs",
  "--warn-redundant-casts"
]

[ruff]
# Ruff linting configuration - catches errors, warnings, and style issues
# Similar to ESLint in JavaScript ecosystem (fast linter written in Rust)
args = [
  "--select=E,W,F,I,N,UP,B,C4",  # E=errors, W=warnings, F=Pyflakes, I=isort, N=pep8-naming, UP=pyupgrade, B=flake8-bugbear, C4=flake8-comprehensions
  "--ignore=E501",   # Line length (Black handles this)
]