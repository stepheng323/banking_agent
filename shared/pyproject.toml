[tool.poetry]
name = "shared"
version = "0.1.0"
description = "Shared models and utilities for banking agent"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.0"
redis = "^5.0.0"
httpx = "^0.25.0"
psycopg2-binary = "^2.9.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
